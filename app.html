<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Workspace — SONKOFLOW</title>
    <link rel="icon" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/design-system.css" />

  </head>
  <body class="application">
    <a class="skip" href="#workspace">Skip to workspace</a>
    <header class="app-header">
      <a class="logo brand-lockup" href="/" aria-label="SONKOFLOW home"

          class="brand-wordmark"
          src="/brand/wordmark-ink.svg"

    <script type="module" src="/src/application.js"></script>
